egrations:[{idx:36,semaine:"8",domaine:"LIRE",titre:"Répondre à des questions explicites et implicites : 'La rentrée des troupeaux' (Alphonse DAUDET)",texteRef:"La rentrée des troupeaux, Alphonse DAUDET, Lettres de mon moulin",situationApprentissage:"Un concours est organisé par le club RFI. Pour faire partie des gagnants, tu dois répondre correctement aux questions posées sur le texte 'La rentrée des troupeaux' d'Alphonse Daudet. Lis attentivement et réponds.",traceEcrite:"Pour répondre à des questions de compréhension : 1- Lire le texte deux fois (première lecture globale, deuxième lecture analytique). 2- Questions explicites : la réponse est directement dans le texte — la relever en la reformulant. 3- Questions implicites : déduire la réponse à partir du contexte, des indices, du comportement des personnages. 4- Toujours justifier sa réponse par un retour au texte. Exemple du texte : Q- Pourquoi l'auteur préfère-t-il sa vie en Provence à Paris ? (implicite) → Il décrit Paris comme 'bruyant et noir' et son moulin comme 'parfumé et chaud', ce qui montre sa préférence.",evaluation:"1. Quel est le titre du texte ? (1pt) 2. Dans quel pays l'histoire se passe-t-elle ? (1pt) 3. Pourquoi les troupeaux redescendent-ils de la montagne ? (2pts) 4. Cite trois animaux présents dans le texte. (3pts) 5. Quel sentiment ressent l'auteur en regardant la scène ? Justifie ta réponse. (3pts) Total : 10pts.",devoirMaison:"",isIntegration:true},{idx:37,semaine:"8",domaine:"ORAL",titre:"Récitation : 'Le Corbeau et le Renard' (Jean de la Fontaine)",texteRef:"Le Corbeau et le Renard, Jean de LA FONTAINE, Fables",situationApprentissage:"Un concours de récitation est lancé pour primer les meilleurs élèves. Récite avec expression et en respectant le rythme et la musique de la fable.",traceEcrite:"Critères de réussite pour réciter une fable : 1- Mémorisation parfaite (aucune hésitation). 2- Prononciation claire et articulée. 3- Respect de la versification : pauses aux fins de vers et aux virgules. 4- Expression des émotions : voix différente pour le corbeau et le renard. 5- Regard sur l'auditoire, posture assurée. 6- Débit adapté : ni trop vite, ni trop lent.",evaluation:"Grille : mémorisation (4pts) + prononciation (3pts) + rythme (3pts) + expression (3pts) + posture (2pts) = 15pts + 5pts bonus si mimique.",devoirMaison:"",isIntegration:true},{idx:38,semaine:"8",domaine:"VOCABULAIRE",titre:"Transformer un texte avec des synonymes, des antonymes et des mots dérivés",texteRef:"L'Enchanteur, René BARJAVEL, éd. Denoël, 1984",situationApprentissage:"À partir du texte de Barjavel sur Viviane et Arthur, identifie les mots construits avec un préfixe, trouve leur sens, et remplace des mots par des synonymes ou antonymes plus précis.",traceEcrite:"1- Les mots formés avec 're-' (re = de nouveau) : reprit, recommença, redevint, repoussèrent → expriment la répétition ou le retour à un état. 2- Synonymes à trouver : s'agenouilla (se prosterna, se mit à genoux), murmurant (chuchotant, soufflant). 3- Antonymes : fendue ≠ intacte / répandu ≠ absorbé / s'allongea ≠ se releva. 4- L'emploi répété du préfixe 're-' dans ce texte montre le retour à la vie et à la normalité.",evaluation:"a. Relève 4 verbes en 're-' dans le texte et explique le sens du préfixe dans chacun. (4pts) b. Trouve 2 synonymes de 'murmurant' et 2 antonymes de 'fendu'. (4pts) c. Emploie 'recommencer' et 'repousser' dans des phrases personnelles. (2pts)",devoirMaison:"",isIntegration:true},{idx:39,semaine:"8",domaine:"ORTHOGRAPHE",titre:"Dictée de bilan : les apprentissages de la période",texteRef:"",situationApprentissage:"Un concours de dictée est organisé par l'ONG Plan International. Suis attentivement les règles apprises et écris sans erreur.",traceEcrite:"Points à vérifier dans la dictée : 1- Les doubles consonnes après préfixe (add-, eff-, att-, all-, app-, off-). 2- Les adjectifs numéraux cardinaux (quatre-vingts, deux-cents). 3- Les accords dans le groupe nominal. 4- Les homophones grammaticaux. emps de verbe il faut qu’il soit ici.= il faut qu’il vienne ici soit peut être aussi une conjonction qui signifie c’est-à-dire, supposons, ou bien… ou un adverbe qui exprime une concession ou un accord non enthousiaste Soient est le verbe être conjuguer à la troisième personne du pluriel du subjonctif présent. Il faut qu’ils soient ici. Qu’ils soient plus jeunes les aide. Il peut être remplacé par un verbe conjugué à la même personne grammaticale et au même temps de verbe Il faut qu’ils soient ici=Il faut qu’ils viennent ici. Qu’ils soient plus jeunes les aide=qu’ils paraissent plus jeunes les aides.",evaluation:"soit, soient et sois ?                        oral        d’exercice",devoirMaison:"",isIntegration:false},{idx:58,semaine:"11",domaine:"GRAMMAIRE",titre:"les verbes aller ; devoir ; dire ; être ; avoir au subjonctif présent.",texteRef:"Initiation au culte vodou, Amegnona AZIABLE",situationApprentissage:"Ton camarade te demande de l’aider à conjuguer les verbes aller, devoir, dire, être, avoir au subjonctif du présent. Aide-le.",traceEcrite:"1- Emploi du subjonctif présent Le subjonctif présent exprime une action 129 é  incertaine, non réalisable au moment où nous nous exprimons. Je préfère qu’il soit à l’école Remarque : Quand on emploi le subjonctif présent dans une proposition subordonnée, alors le verbe de la proposition principale est au présent de l’indicatif. 2- Terminaison du subjonctif présent (voir tableau en annexe)",evaluation:"subjonctif présent ?                           oral        d’exercice",devoirMaison:"",isIntegration:false},{idx:59,semaine:"11",domaine:"EXPRESSION ECRITE",titre:"Le résumé de texte",texteRef:"Initiation au culte vodou, Amegnona AZIABLE",situationApprentissage:"Vous avez lu en classe le texte ‘’Initiation au culte vodou’’ de Amegnona AZIABLE en l’absence de votre camarade Adjo. Aider-la à comprendre en lui faisant lire le résumé de ce texte.",traceEcrite:"questionnement les           puis           oral puis    tableau au apprenants vers à peu près   prennent       écrit        cahier de la trace écrite suivante…    note                        cours 132 é  Q- que signifie « résumer un texte » ? Résumer un texte c’est réduire le texte, c’est transformer un texte long en un texte nouveau plus court Q : comment résume-t-on un texte ? Que fait-on pour résumer un texte ? - Il faut lire attentivement le texte pour bien le comprendre - dégager les idées générale et les différentes parties du texte - souligner au crayon les mots clés et les idées importantes et les relever au brouillon - supprimer tous les éléments de moindre importance - employer un terme commun qui rassemble les termes donnés dans le texte - respecter les temps verbe du texte - éviter la répétition",evaluation:"résumer un texte ?                            oral        d’exercice",devoirMaison:"",isIntegration:false}],integrations:[{idx:60,semaine:"12",domaine:"LIRE",titre:"Compréhension du conte : 'Le lièvre et le grand génie de la brousse'",texteRef:"Le lièvre et le grand génie de la brousse, conte africain",situationApprentissage:"Un concours est lancé pour primer les meilleurs élèves qui répondront correctement aux questions posées sur ce conte. Lis attentivement et montre ta compréhension de l'histoire.",traceEcrite:"Éléments de réponse : 1- Le titre du texte : 'Le lièvre et le grand génie de la brousse'. 2- Le lièvre est allé voir le grand génie de la brousse. 3- Le génie ne voulait pas répondre immédiatement car il voulait éprouver la sincérité et la ruse du lièvre. 4- Les oiseaux ont finalement rempli la gourde : VRAI. 5- Valeur morale du conte : la ruse et l'intelligence l'emportent sur la force brute. Dans les contes, le héros utilise l'astuce pour surmonter les défis.",evaluation:"1. Quel est le titre du texte ? (1pt) 2. Qui le lièvre est-il allé voir ? (1pt) 3. Pourquoi le génie refusait-il de répondre immédiatement ? (2pts) 4. Les oiseaux ont rempli la gourde : vrai ou faux ? Justifie. (2pts) 5. Quelle valeur  a un bon cœur' (2pts) / 'Amavi a pris la fuite' (2pts) / 'Jean a pris la moto' (2pts) + Construis 2 phrases avec 'prendre' au sens propre et 2 au sens figuré (2pts) = 10pts.",devoirMaison:"",isIntegration:true},{idx:63,semaine:"12",domaine:"ORTHOGRAPHE",titre:"Dictée de bilan : sons et graphies complexes",texteRef:"",situationApprentissage:"Un concours de dictée est organisé. Écris sans erreur le texte dicté en appliquant les règles apprises : consonnes s/c/ç/sc/t/x, homophones (soit/soi/soie), mots avec -tion/-sion/-xion.",traceEcrite:"Dictée : La science nous aide à mieux comprendre la nature. Il faut que les résultats soient bons pour progresser. Attention à l'orthographe des mots comme : connexion, la danse, la façade, sois tranquille, la nation. Ces mots possèdent d'importantes informations sur notre monde. Chaque élève doit être en paix avec soi-même pour apprendre avec efficacité.",evaluation:"Notation : 20 points − 1 point par faute. Accords (5pts) + homophones (5pts) + graphies complexes (5pts) + ponctuation (5pts) = 20pts.",devoirMaison:"",isIntegration:true},{idx:64,semaine:"12",domaine:"GRAMMAIRE",titre:"Exercices : subjonctif présent et fonctions grammaticales",texteRef:"",situationApprentissage:"Ton grand frère te soumet ces exercices et te demande de l'aider. Mets les verbes au subjonctif présent et identifie les fonctions grammaticales demandées.",traceEcrite:"Rappel du subjonctif présent : 1- Emploi : action incertaine, souhait, nécessité → introduit par 'il faut que', 'il est important que', 'je veux que'. 2- Terminaisons régulières : -e, -es, -e, -ions, -iez, -ent. 3- Verbes irréguliers à mémoriser : être (sois/soit/soient), avoir (aie/ait/aient), aller (aille), faire (fasse). Exercices corrigés : 1- qu'il prenne (3e pers. sing.) / 2- qu'ils arrivent / 3- que tu sois / 4- qu'il aille / 5- qu'ils aient.",evaluation:"I. Mets au subjonctif présent (10pts : 2pts chaque) : prendre (3e sing.), être (2e sing.), aller (3e sing.), avoir (3e plur.), dire (1re plur.). II. Identifie la fonction des mots soulignés dans 3 phrases. (6pts) III. Construis 2 phrases avec le subjonctif. (4pts) = 20pts.",devoirMaison:"",isIntegration:true},{idx:65,semaine:"12",domaine:"EXPRESSION ECRITE",titre:"Description d'une image ou d'une scène traditionnelle",texteRef:"",situationApprentissage:"Ton grand-père handicapé visuel te demande de lui décrire une scène de coutume ou de tradition observée dans ton village ou quartier (une fête, une cérémonie, un marché traditionnel). Aide-le en écrivant une description de 12 à 15 lignes.",traceEcrite:"Pour réussir la description d'une scène : 1- Présenter le cadre (lieu, moment, circonstance). 2- Décrire les éléments visuels : les personnes, leurs tenues, leurs gestes. 3- Évoquer les sons, les odeurs, l'ambiance. 4- Utiliser le présent de description ou l'imparfait. 5- Employer des comparaisons et des adjectifs expressifs. 6- Conclure sur l'impression générale que la scène produit.",evaluation:"Cadre et contexte (3pts) + richesse des descriptions (4pts) + vocabulaire du thème (3pts) + orthographe (4pts) + longueur respectée (2pts) = 16pts + 4pts bonus.",devoirMaison:"",isIntegration:true}]},{num:4,titre:"Thème 4 — Les arts et les métiers",volume:"18h",seances:[{idx:66,semaine:"13",domaine:"LIRE",titre:"l’enchaînement chronologique des événements d’un récit.",texteRef:"La biche sculptée, Camara LAYE",situationApprentissage:"Pour comprendre ce texte, ton camarade de banc te demande de l’aider à repérer les mots ou groupe de mots liés à la notion du temps dans le texte (exemple : au début, après , ensuite…)",traceEcrite:"questionnement les             puis            oral puis     tableau au écrit 143 é  apprenants vers à peu près     prennent                    cahier de la trace écrite suivante…      note                        cours Une histoire se déroule selon un ordre chronologique. C’est une succession d’événements qui se déroule selon un certain nombre dans le temps",evaluation:"oral maine:"LIRE",titre:"Répondre à des questions sur un texte narratif : évaluation de la période",texteRef:"La petite ménagère, Abdoulaye SADJI, Maïmouna",situationApprentissage:"Pour valider tes acquis de la période sur les arts et les métiers, lis un extrait inédit et réponds aux questions explicites et implicites. Mobilise toutes tes stratégies de lecture.",traceEcrite:"Critères d'évaluation : 1- Identifier correctement le titre, l'auteur, l'œuvre (2pts). 2- Répondre aux questions explicites en citant le texte (4pts). 3- Répondre aux questions implicites en justifiant par le contexte (4pts). 4- Identifier le personnage principal et ses actions (4pts). 5- Donner un titre alternatif au texte et le justifier (2pts). 6- Résumer le texte en 6 lignes (4pts). Total : 20pts.",evaluation:"Exercice sur feuille, 30 minutes, sans livres ni notes. Chaque question vaut selon le barème ci-dessus.",devoirMaison:"",isIntegration:true},{idx:85,semaine:"16",domaine:"ORAL",titre:"Présenter et reformuler un chapitre de l'œuvre intégrale",texteRef:"Maïmouna, Abdoulaye SADJI",situationApprentissage:"Tu vas présenter oralement à tes camarades le résumé d'un chapitre de Maïmouna en expliquant ce qui s'est passé, qui sont les personnages impliqués, et quel est l'intérêt de ce passage.",traceEcrite:"Structure de la présentation orale d'un chapitre : 1- Situer le chapitre dans l'œuvre (avant/après quoi ?). 2- Résumer les événements principaux dans l'ordre chronologique. 3- Présenter les personnages impliqués et leur rôle. 4- Dégager l'idée principale du chapitre. 5- Donner son opinion personnelle sur ce passage (en quoi est-il important ?). Durée : 3 à 4 minutes maximum.",evaluation:"Grille : cohérence du résumé (4pts) + ordre chronologique (3pts) + identification des personnages (3pts) + expression orale (3pts) + opinion argumentée (3pts) = 16pts.",devoirMaison:"",isIntegration:true},{idx:86,semaine:"16",domaine:"VOCABULAIRE",titre:"Réemployer les mots nouveaux de la période dans un paragraphe",texteRef:"",situationApprentissage:"À partir de la liste des mots étudiés pendant le Thème 4 (arts, métiers, dérivation), écris un paragraphe de 8 lignes où tu utiliseras au moins 10 de ces mots correctement.",traceEcrite:"Mots à réemployer (sélection) : argile, sculpture, esthétique, peinture, artisan, métier, dérivation, famille de mots, générique, spécifique, œuvre, créer, façonner, ciseler, tisser, vannerie, électricien, ingénieur, comptable, anesthésie. Critères : les mots doivent être utilisés correctement dans leur sens et leur classe grammaticale. Éviter la simple liste : les intégrer dans des phrases construites.",evaluation:"10 mots correctement réemployés (10pts) + cohérence du paragraphe (4pts) + orthographe (4pts) + originalité (2pts) = 20pts.",devoirMaison:"",isIntegration:true},{idx:87,semaine:"16",domaine:"ORTHOGRAPHE",titre:"Dictée de bilan : participes passés et accords",texteRef:"",situationApprentissage:"Cette dictée porte sur les apprentissages clés du Thème 4 : accords du participe passé avec avoir et être, fonctions de l'adjectif qualificatif, homophones 'leur/leurs'.",traceEcrite:"Texte de dictée : Les sculptures que l'artisan avait créées sont exposées au musée. Ses apprentis ont bien travaillé : ils ont façonné des poteries remarquables. La biche que le sculpteur avait sculptée semble vivante. Les œuvres sont appréciées par leurs acheteurs. Il leur a offert ses meilleures créations. Ces métiers, qu'on pensait oubliés, sont redevenus populaires.",evaluation:"Notation : 20 points − 1 point par faute. Participes passés avec avoir (6pts) + participes passés avec être (4pts) + homophones leur/leurs (4pts) + accords adjectifs (4pts) + ponctuation (2pts) = 20pts.",devoirMaison:"",isIntegration:true},{idx:88,semaine:"16",domaine:"GRAMMAIRE",titre:"Exercices : expansion du nom, proposition relative, attribut du COD",texteRef:"",situationApprentissage:"Réalise ces exercices structuraux pour valider tes acquis grammaticaux de la période : expansion du nom, propositions subordonnées relatives, attribut du COD.",traceEcrite:"Exercices et corrigés : I. Expansion du nom — 'Un artisan' → 'Un vieil artisan habile qui façonne l'argile' (adjectif + relative). II. Proposition relative — construire une phrase avec 'dont', 'que', 'où', 'qui'. III. Attribut du COD — 'Les spectateurs ont trouvé la sculpture impressionnante' → identifier l'attribut. IV. Accord de l'adjectif — accorder correctement dans le groupe nominal.",evaluation:"I. Expansion du nom (6pts) + II. Propositions relatives (6pts) + III. Attribut du COD (4pts) + IV. Accords (4pts) = 20pts.",devoirMaison:"",isIntegration:true},{idx:89,semaine:"16",domaine:"EXPRESSION ECRITE",titre:"Révision et amélioration de la production écrite de la période",texteRef:"",situationApprentissage:"Le professeur redistribue les productions du Thème 4. Tu vas relire ton texte sur le métier de ton choix ou sur l'activité d'un artisan, identifier tes erreurs et proposer une version améliorée en tenant compte des corrections.",traceEcrite:"Grille de révision : 1- Vérifier la structure narrative (situation initiale, péripéties, dénouement) ou descriptive. 2- Corriger les erreurs d'orthographe signalées. 3- Améliorer le vocabulaire : remplacer les mots répétés par des synonymes. 4- Vérifier les accords (adjectifs, participes passés). 5- Améliorer la ponctuation. 6- Réécrire proprement la version corrigée (15 lignes minimum).",evaluation:"Amélioration visible par rapport à la première version (6pts) + orthographe (5pts) + vocabulaire enrichi (3pts) + structure (4pts) + présentation (2pts) = 20pts.",devoirMaison:"",isIntegration:true}]},{num:5,titre:"Thème 5 — Les aventures et mystères",volume:"18h",seances:[{idx:72,semaine:"13",domaine:"LIRE",titre:"La compréhension et l'analyse d'un texte narratif d'aventure",texteRef:"Épidémie de variole à Louga, Abdoulaye SADJI, Maïmouna",situationApprentissage:"Tu viens de lire un extrait de roman décrivant une épidémie de variole à Louga. En t'appuyant sur le texte, identifie les éléments qui créent la tension narrative et montrent la réaction des habitants face au danger.",traceEcrite:"Un texte narratif d'aventure ou de suspense comporte : 1- Un cadre spatio-temporel précis (lieu, époque). 2- Des personnages confrontés à une situation de danger ou d'urgence. 3- Des procédés qui créent la tension : le rythme, les phrases courtes, les réactions des personnages, les descriptions de l'environnement. 4- Une progression narrative : situation initiale, élément perturbateur, péripéties, résolution.",evaluation:"Relève dans le texte trois procédés qui créent l'atmosphère dramatique et justifie chacun en citant un exemple.",devoirMaison:"Résume l'extrait en 8 à 10 lignes en conservant les éléments essentiels de l'intrigue.",isIntegration:false},{idx:73,semaine:"13",domaine:"ORAL",titre:"Le compte rendu d'une aventure vécue ou imaginée",texteRef:"",situationApprentissage:"Tu as vécu ou imaginé une aventure marquante (une excursion, une nuit de pluie violente, une rencontre inattendue). Raconte-la à tes camarades en respectant la chronologie et en utilisant des expressions pour maintenir l'attention.",traceEcrite:"Pour rendre compte d'une aventure à l'oral : 1- Situer le cadre (où, quand). 2- Présenter les personnages impliqués. 3- Raconter les faits dans l'ordre chronologique en utilisant des connecteurs : d'abord, ensuite, puis, soudain, enfin. 4- Exprimer les émotions ressenties. 5- Conclure sur le dénouement. 6- Maintenir l'attention : varier le débit, marquer des pauses, regarder son auditoire.",evaluation:"Un apprenant raconte une aventure de 3 minutes. Les autres évaluent : la chronologie, les connecteurs utilisés et l'expression des émotions.",devoirMaison:"Prépare un compte rendu oral de 2 minutes sur une aventure réelle ou inventée.",isIntegration:false},{idx:74,semaine:"13",domaine:"VOCABULAIRE",titre:"Le champ lexical du mystère et de l'aventure",texteRef:"",situationApprentissage:"Dans les textes d'aventure et de mystère, certains mots créent une atmosphère particulière. Relève dans l'extrait de Sadji les mots qui expriment la peur, le danger, l'inconnu et classe-les par catégories.",traceEcrite:"1- Le champ lexical du mystère : l'ombre, le silence, l'inconnu, l'inquiétude, le frisson, la terreur, le pressentiment, le doute, l'énigme. 2- Le champ lexical de l'aventure : le défi, le courage, l'obstacle, la péripétie, le danger, la bravoure, l'exploit, l'expédition. 3- Utilisation : ces mots permettent de créer une atmosphère et de caractériser les personnages et les situations.",evaluation:"Emploie 5 mots du champ lexical du mystère dans un court paragraphe de 4 lignes.",devoirMaison:"Cherche dans un dictionnaire 5 autres mots appartenant au champ lexical de l'aventure.",isIntegration:false},{idx:75,semaine:"13",domaine:"ORTHOGRAPHE",titre:"Les accords dans le groupe nominal (révision et approfondissement)",texteRef:"",situationApprentissage:"Dans la phrase 'Les pauvres habitants décimés fuyaient les rues silencieuses', relève tous les groupes nominaux et vérifie les accords en genre et en nombre.",traceEcrite:"Règle : Dans un groupe nominal, le déterminant, l'adjectif épithète et le nom s'accordent en genre (masculin/féminin) et en nombre (singulier/pluriel). Exemples : une vague de terreur — des habitants effrayés — les rues silencieuses. Attention aux adjectifs placés après le nom (épithètes) et avant le nom (épithètes antéposées) : ils s'accordent toujours avec le nom.",evaluation:"Mets au pluriel les groupes nominaux suivants : 'un malade découvert', 'la rue silencieuse', 'un service médical rapide'.",devoirMaison:"Écris 5 groupes nominaux (déterminant + adjectif + nom) au masculin singulier, puis mets-les au féminin pluriel.",isIntegration:false},{idx:76,semaine:"13",domaine:"GRAMMAIRE",titre:"Les types de phrases et les formes de phrases dans les textes d'aventure",texteRef:"",situationApprentissage:"Dans un texte d'aventure, l'auteur varie les types de phrases pour créer de l'émotion. Identifie dans l'extrait de Sadji les phrases déclaratives, interrogatives et exclamatives, et explique leur effet.",traceEcrite:"1- Types de phrases : déclarative (énonce un fait), interrogative (pose une question), exclamative (exprime une émotion intense), injonctive (donne un ordre). 2- Formes de phrases : affirmative (Le médecin arriva) / négative (Le médecin n'arriva pas). 3- Dans les textes d'aventure, les phrases courtes et exclamatives créent le rythme et la tension : 'Fuyez ! La variole est là !'",evaluation:"Transforme ces phrases déclaratives en phrases exclamatives et explique l'effet produit : 'Les habitants ont peur.' / 'Le médecin est arrivé.'",devoirMaison:"Écris un paragraphe de 6 lignes racontant un moment de panique en variant les types de phrases.",isIntegration:false},{idx:77,semaine:"13",domaine:"EXPRESSION ECRITE",titre:"La rédaction d'un récit d'aventure",texteRef:"",situationApprentissage:"À partir du texte de Sadji sur l'épidémie, tu vas rédiger un court récit d'aventure (15 lignes) mettant en scène un jeune héros qui doit surmonter un obstacle ou un danger dans son village ou sa ville.",traceEcrite:"Pour rédiger un récit d'aventure réussi : 1- Choisir un cadre précis et une situation de départ. 2- Introduire un élément perturbateur qui déclenche l'action. 3- Décrire les péripéties : les obstacles et comment le personnage les surmonte. 4- Utiliser des verbes d'action variés, des adverbes de temps et des connecteurs logiques. 5- Soigner la conclusion : résolution et réaction du personnage. 6- Relire pour vérifier l'orthographe et la cohérence.",evaluation:"Échange ta production avec un camarade : vérifie si le récit respecte la structure, si les péripéties sont claires et si les accords sont corrects.",devoirMaison:"",isIntegration:false},{idx:78,semaine:"14",domaine:"LIRE",titre:"L'identification et la hiérarchisation des informations dans un texte",texteRef:"La belle saison, Abdoulaye SADJI, Maïmouna",situationApprentissage:"Tu lis un extrait de Maïmouna décrivant la nature en fin d'hivernage. Identifie les informations essentielles (explicites) et les informations implicites que l'auteur suggère sans les énoncer directement.",traceEcrite:"1- Information explicite : clairement énoncée dans le texte, on peut la relever directement. 2- Information implicite : sous-entendue, il faut déduire à partir du contexte, des images ou du comportement des personnages. 3- Hiérarchiser les informations : distinguer l'idée principale (de quoi parle le texte en général) des idées secondaires (les détails qui développent l'idée principale).",evaluation:"Lis l'extrait et classe 4 informations en : 'explicite' ou 'implicite'. Justifie chaque réponse.",devoirMaison:"Lis un texte de ton choix et relève 2 informations explicites et 2 informations implicites.",isIntegration:false},{idx:79,semaine:"14",domaine:"ORAL",titre:"La dramatisation d'une scène d'aventure",texteRef:"",situationApprentissage:"Par groupes de 3, vous allez mettre en scène la scène de l'arrivée de la voiture-ambulance dans le village. Répartissez les rôles : narrateur, habitant effrayé, médecin. Jouez la scène en donnant de l'expressivité à votre voix.",traceEcrite:"Pour dramatiser une scène : 1- Adapter sa voix au personnage (ton grave pour le danger, voix tremblante pour la peur). 2- Marquer des pauses aux moments clés. 3- Utiliser des gestes et des mimiques appropriés. 4- Respecter les répliques et l'enchaînement logique de la scène. 5- Soigner l'entrée en scène et la sortie.",evaluation:"Chaque groupe présente sa dramatisation. La classe évalue : l'expressivité, le respect du texte, la fluidité.",devoirMaison:"Mémorise une réplique de 5 à 6 lignes et entraîne-toi à la dire avec expressivité.",isIntegration:false},{idx:80,semaine:"14",domaine:"VOCABULAIRE",titre:"Les synonymes et les antonymes dans les textes descriptifs",texteRef:"",situationApprentissage:"Dans la description de 'La belle saison', Sadji utilise des mots précis pour décrire la nature. Trouve les synonymes des mots soulignés et les antonymes des adjectifs qui décrivent la saison.",traceEcrite:"1- Synonymes : mots de sens proche (rajeunie / revitalisée / renouvelée). 2- Antonymes : mots de sens contraire (chaud ≠ froid / permanent ≠ éphémère / frais ≠ étouffant). 3- L'utilisation des synonymes enrichit le style et évite les répétitions. 4- Utiliser des antonymes permet de créer des contrastes expressifs.",evaluation:"Remplace les mots entre parenthèses par un synonyme plus précis ou plus expressif dans ce contexte : 'La nature semblait (belle) après les pluies. Le vent était (agréable).'",devoirMaison:"Cherche 3 synonymes et 3 antonymes pour les mots : 'courage', 'rapide', 'sombre'.",isIntegration:false},{idx:81,semaine:"14",domaine:"ORTHOGRAPHE",titre:"Les homophones grammaticaux : ou/où, et/est, a/à, son/sont",texteRef:"",situationApprentissage:"Dans les phrases : 'Le mil est haut et les épis jaunissaient' et 'Il roulait vers l'ouest, conscient du mépris dont les hommes le couvraient à présent', identifie les homophones et explique leur différence.",traceEcrite:"Homophones à maîtriser : 1- ou (choix) / où (lieu, temps) 2- et (coordination, remplaçable par 'et puis') / est (verbe être, remplaçable par 'était') 3- a (verbe avoir) / à (préposition, ne se conjugue pas) 4- son (déterminant possessif) / sont (verbe être au pluriel) Astuce : remplacer par la forme à l'imparfait pour distinguer les formes verbales des autres.",evaluation:"Complète avec le bon homophone : 'Le village ___ calme. L'enfant ___ parti ___ la fontaine. ___ courage ___ son seul atout.'",devoirMaison:"Écris 5 phrases en utilisant correctement chacun des homophones étudiés.",isIntegration:false},{idx:82,semaine:"14",domaine:"GRAMMAIRE",titre:"Les compléments circonstanciels de temps, de lieu et de manière",texteRef:"",situationApprentissage:"Dans la description de la belle saison, relève les groupes de mots qui indiquent le lieu, le temps et la manière. Classe-les et montre leur rôle dans la construction du texte.",traceEcrite:"1- CC de temps : indique quand l'action a lieu. Questions : quand ? depuis quand ? (ex : en cette fin d'hivernage, bientôt). 2- CC de lieu : indique où l'action se passe. Question : où ? (ex : vers l'Ouest, dans les champs). 3- CC de manière : indique comment l'action se fait. Question : comment ? (ex : malencontreusement, entre eux). Caractéristiques : les CC sont souvent déplaçables et supprimables sans changer le sens fondamental de la phrase.",evaluation:"Identifie et classe les CC dans : 'Dès l'aube, les paysans travaillent joyeusement dans les champs.' / 'La nuit, le vent souffle doucement sur la colline.'",devoirMaison:"Enrichis ces phrases en ajoutant un CC de temps, un CC de lieu et un CC de manière : 'Les enfants jouent.'",isIntegration:false},{idx:83,semaine:"14",domaine:"EXPRESSION ECRITE",titre:"La description d'un paysage en mouvement (la nature vivante)",texteRef:"",situationApprentissage:"Comme Sadji décrit la nature qui se réveille après la saison des pluies, tu vas décrire la nature autour de chez toi après une nuit de forte pluie ou au début de la saison sèche, en utilisant des images et des comparaisons.",traceEcrite:"Pour réussir une description de paysage : 1- Choisir un point de vue (panoramique ou rapproché). 2- Procéder par ordre : ce qu'on voit au premier plan, puis à l'arrière-plan. 3- Utiliser des images sensorielles : la vue, l'ouïe, le toucher, l'odorat. 4- Employer des comparaisons et des métaphores. 5- Choisir des adjectifs précis et expressifs. 6- Donner l'impression de mouvement : verbes dynamiques, adverbes.",evaluation:"Lis ta description à voix haute. Tes camarades te disent si l'image de la nature est claire et vivante.",devoirMaison:"",isIntegration:false},{idx:84,semaine:"15",domaine:"LIRE",titre:"L'analyse d'une épopée : personnage héroïque et destin exceptionnel",texteRef:"Naissance et enfance de Soundjata, Djibril Tamsir NIANE, Soundjata ou l'épopée mandingue, Présence africaine",situationApprentissage:"Tu lis un extrait de l'épopée de Soundjata. Identifie les caractéristiques du personnage héroïque : en quoi Soundjata est-il différent des autres enfants, et quels éléments laissent pressentir sa destinée exceptionnelle ?",traceEcrite:"1- L'épopée est un long récit qui raconte les exploits d'un héros au destin exceptionnel. 2- Le héros épique : il a souvent une naissance accompagnée de signes (tonnerre, éclairs, prophéties). Il surmonte des épreuves malgré ses faiblesses apparentes. Il possède des qualités cachées qui se révèlent progressivement. 3- Les éléments merveilleux : les devinages, les prophéties, les phénomènes naturels extraordinaires. 4- La structure de l'épopée : naissance, enfance difficile, révélation des pouvoirs, exploits, victoire finale.",evaluation:"Relève trois éléments du texte qui montrent que Soundjata est un personnage hors du commun. Justifie avec des citations.",devoirMaison:"Recherche un autre héros épique africain (Chaka, Samory Touré) et note 3 caractéristiques qui le définissent.",isIntegration:false},{idx:85,semaine:"15",domaine:"ORAL",titre:"La récitation et la déclamation d'un poème ou d'un texte épique",texteRef:"",situationApprentissage:"À partir d'un extrait de l'épopée de Soundjata, chaque apprenant va choisir un passage de 8 à 10 lignes à mémoriser et déclamer devant la classe en respectant le rythme, la prononciation et l'expressivité.",traceEcrite:"Pour déclamer un texte épique ou un poème : 1- Mémoriser le texte avec une compréhension profonde du sens. 2- Marquer les pauses aux virgules et aux points. 3- Mettre en valeur les mots importants en les accentuant. 4- Varier le débit : ralentir pour les passages graves, accélérer pour les moments d'action. 5- Regarder l'auditoire et non le papier. 6- Adopter une posture droite et assurée.",evaluation:"Chaque apprenant déclame son passage. La classe évalue : mémorisation, prononciation, rythme, expressivité (1 point chacun).",devoirMaison:"Mémorise intégralement le passage choisi et entraîne-toi à le dire avec expression.",isIntegration:false},{idx:86,semaine:"15",domaine:"VOCABULAIRE",titre:"Le champ lexical du courage, de la force et de la destinée",texteRef:"",situationApprentissage:"Dans l'épopée de Soundjata, plusieurs mots expriment le courage, la force et le destin. Relève-les et classe-les selon qu'ils décrivent le héros ou son environnement.",traceEcrite:"1- Lexique du courage et de la force : la bravoure, la vaillance, l'endurance, la ténacité, la résolution, l'intrépidité, la persévérance. 2- Lexique du destin et du merveilleux : la prophétie, le présage, le devin, le destin, la destinée, le prodige, le signe, l'oracle. 3- Lexique de la faiblesse surmontée : l'infirmité, la lenteur, l'obstacle, l'épreuve, la difficulté. Ces trois champs lexicaux construisent le portrait du héros épique.",evaluation:"Emploie 5 mots du lexique du courage dans un paragraphe de 5 lignes décrivant un personnage courageux.",devoirMaison:"Constitue un mini-dictionnaire de 10 mots du champ lexical du merveilleux avec une définition pour chacun.",isIntegration:false},{idx:87,semaine:"15",domaine:"ORTHOGRAPHE",titre:"La conjugaison des verbes au passé simple dans les récits épiques",texteRef:"",situationApprentissage:"Dans l'extrait de l'épopée, repère tous les verbes au passé simple. Donne leur infinitif et leur groupe, puis justifie l'emploi du passé simple dans ce type de récit.",traceEcrite:"1- Le passé simple s'emploie dans les récits écrits pour exprimer une action passée, limitée dans le temps. 2- Terminaisons du passé simple : 1er groupe : -ai, -as, -a, -âmes, -âtes, -èrent. 2e groupe : -is, -is, -it, -îmes, -îtes, -irent. 3e groupe : irréguliers à mémoriser (être : fus / avoir : eus / venir : vins). 3- Le passé simple donne au récit un rythme dynamique et un caractère solennel adapté à l'épopée.",evaluation:"Conjugue au passé simple : 'naître, grandir, bondir, être, avoir' à la 3e personne du singulier et du pluriel.",devoirMaison:"Écris 5 phrases au passé simple racontant les exploits d'un héros de ton choix.",isIntegration:false},{idx:88,semaine:"15",domaine:"GRAMMAIRE",titre:"La proposition subordonnée relative",texteRef:"",situationApprentissage:"Dans la phrase 'Un devin a promis au roi qu'il aurait un fils qui aurait un destin exceptionnel', identifie les propositions subordonnées et leurs pronoms relatifs. Explique leur rôle.",traceEcrite:"1- La proposition subordonnée relative est introduite par un pronom relatif : qui, que, qu', dont, où, lequel, auquel, duquel. 2- Elle complète un nom ou un pronom (antécédent) : 'le fils qui marchait' (qui complète 'fils'). 3- Fonctions du pronom relatif : qui = sujet / que = COD / dont = complément du nom / où = CC de lieu ou de temps. 4- La proposition relative est une expansion du groupe nominal : elle enrichit la description des personnages et des lieux.",evaluation:"Identifie le pronom relatif, son antécédent et sa fonction dans : 'La mère dont le fils était infirme souffrait en silence.' / 'Le jour où Sogolon accoucha est resté gravé dans la mémoire.'",devoirMaison:"Construis 5 phrases contenant chacune une proposition subordonnée relative avec un pronom relatif différent.",isIntegration:false},{idx:89,semaine:"15",domaine:"EXPRESSION ECRITE",titre:"La rédaction d'un récit épique : le héros et son épreuve fondatrice",texteRef:"",situationApprentissage:"Tu vas créer un court récit épique (15 à 20 lignes) présentant un héros africain imaginaire. Décris sa naissance accompagnée de signes extraordinaires, et l'épreuve qui révèle sa vraie nature.",traceEcrite:"Structure d'un récit épique court : 1- La naissance : signes annonciateurs, prophétie, réaction de l'entourage. 2- L'enfance difficile : une faiblesse apparente ou un obstacle majeur. 3- L'épreuve fondatrice : la situation qui force le héros à se révéler. 4- Le retournement : le héros surmonte l'épreuve de façon spectaculaire. Conseils d'écriture : employer le passé simple, des phrases ample et rythmées, le style oral des griots ('Il fut un temps où...').",evaluation:"Échange ta production. Identifie les éléments épiques (naissance + épreuve + retournement) et note la qualité des verbes au passé simple.",devoirMaison:"",isIntegration:false}],integrations:[{idx:2000,semaine:"16",domaine:"LIRE",titre:"Analyse d'un texte épique ou d'aventure : évaluation intégrée",texteRef:"Naissance et enfance de Soundjata, Djibril Tamsir NIANE, Soundjata ou l'épopée mandingue",situationApprentissage:"Pour valider les acquis du Thème 5, lis un texte d'aventure ou épique inédit et mobilise toutes tes compétences : identifier le type de texte, analyser le personnage, relever le champ lexical, conjuguer au passé simple, et produire un court écrit.",traceEcrite:"Critères d'intégration : 1- Type de texte correctement identifié et justifié (3pts). 2- Analyse du personnage héroïque : qualités + citations (4pts). 3- 2 procédés narratifs repérés et expliqués (3pts). 4- Production écrite de 8 lignes : suite ou commentaire (6pts). 5- Orthographe et accords (4pts). Total : 20pts.",evaluation:"Exercice sur feuille, 45 minutes, individuel, sans livres ni notes.",devoirMaison:"",isIntegration:true},{idx:2001,semaine:"16",domaine:"EXPRESSION ECRITE",titre:"Rédaction d'un récit d'aventure complet : évaluation sommative",texteRef:"",situationApprentissage:"Rédige un récit d'aventure complet (20 à 25 lignes) mettant en scène un jeune héros togolais qui surmonte un danger ou une épreuve extraordinaire. Mobilise toutes les compétences du thème : structure narrative, vocabulaire thématique, passé simple, dialogue au discours direct.",traceEcrite:"Grille d'évaluation : 1- Structure narrative (début, élément perturbateur, péripéties, fin) : 4pts. 2- Vocabulaire du thème (aventure, mystère, héroïsme) : 3pts. 3- Temps verbaux (passé simple, imparfait) : 3pts. 4- Un dialogue au discours direct : 2pts. 5- Accord et orthographe : 4pts. 6- Originalité et intérêt du récit : 2pts. Total : 18pts + 2pts bonus.",evaluation:"Production individuelle sur feuille, 30 minutes.",devoirMaison:"",isIntegration:true}]},{num:6,titre:"Thème 6 — Les qualités et les défauts",volume:"12h",seances:[{idx:90,semaine:"22",domaine:"LIRE",titre:"L'identification des qualités et défauts portés par les personnages",texteRef:"Le choix de Maïmouna, Abdoulaye SADJI, Maïmouna",situationApprentissage:"Tu lis un extrait de Maïmouna où la jeune héroïne fait un choix amoureux qui va à l'encontre des préjugés sociaux. Identifie les qualités de Maïmouna qui transparaissent à travers ses pensées et ses décisions, et les défauts que l'auteur attribue aux autres personnages.",traceEcrite:"1- Les qualités d'un personnage se révèlent à travers : ses actions, ses paroles, ses pensées, les jugements des autres. 2- Les défauts se repèrent de la même façon mais avec des connotations négatives. 3- Le point de vue : l'auteur peut valoriser un personnage (focalisation positive) ou le critiquer (ironie, distance). 4- Les valeurs en jeu dans ce texte : l'indépendance d'esprit / les préjugés sociaux / l'amour sincère / le matérialisme.",evaluation:"Dresse le portrait moral de Maïmouna et de Bounama en relevant au moins 2 qualités/défauts pour chacun, avec des citations du texte.",devoirMaison:"Écris le portrait moral d'un personnage que tu admires (réel ou fictif) en 8 lignes.",isIntegration:false},{idx:91,semaine:"22",domaine:"ORAL",titre:"Le débat sur les qualités et les défauts : argumentation et écoute",texteRef:"",situationApprentissage:"En classe, vous débattez sur la question : 'Les qualités les plus importantes dans la vie sont-elles l'honnêteté, le courage ou le respect ?' Chaque apprenant choisit une position et l'argumente en donnant des exemples concrets.",traceEcrite:"Pour participer à un débat : 1- Énoncer clairement sa position. 2- Donner au moins deux arguments avec des exemples précis. 3- Écouter les autres sans les interrompre. 4- Accepter de nuancer sa position si les arguments adverses sont convaincants. 5- Formules utiles : 'Je pense que...', 'En revanche...', 'D'accord, mais...', 'Je maintiens que...' 6- Conclure en reformulant sa position finale.",evaluation:"Chaque apprenant est évalué sur : clarté de la position, qualité des arguments, respect de la parole des autres.",devoirMaison:"Prépare deux arguments pour défendre la qualité de ton choix dans le débat de demain.",isIntegration:false},{idx:92,semaine:"22",domaine:"VOCABULAIRE",titre:"Le champ lexical des qualités et des défauts moraux",texteRef:"",situationApprentissage:"À partir du texte de Sadji, relève tous les mots qui décrivent des qualités et des défauts moraux. Classe-les en deux colonnes et cherche pour chacun un synonyme et un antonyme.",traceEcrite:"Qualités morales : la générosité, l'honnêteté, le courage, l'humilité, la loyauté, la sincérité, la patience, l'indulgence, la bienveillance. Défauts moraux : l'égoïsme, la jalousie, la lâcheté, l'orgueil, la hypocrisie, l'avarice, la paresse, la cruauté, la rancune. Ces mots permettent de dresser le portrait moral des personnages dans un récit.",evaluation:"Emploie 5 mots des qualités et 5 mots des défauts dans un texte court (8 lignes) présentant deux personnages opposés.",devoirMaison:"Cherche 3 proverbes togolais ou africains sur les qualités et les défauts et explique leur signification.",isIntegration:false},{idx:93,semaine:"22",domaine:"ORTHOGRAPHE",titre:"L'accord du participe passé avec l'auxiliaire avoir",texteRef:"",situationApprentissage:"Dans la phrase 'Elle avait entendu dire à propos du fils à venir... des choses qui ne l'avaient pas rassurée', explique les accords des participes passés soulignés.",traceEcrite:"Règle : Le participe passé employé avec 'avoir' s'accorde avec le complément d'objet direct (COD) si celui-ci est placé avant le verbe. Si le COD est placé après le verbe, le participe reste invariable. Exemples : 'Les choses qu'elle avait entendues' (que = COD avant → accord au féminin pluriel). 'Elle avait entendu des choses' (COD après → pas d'accord). Cas particuliers : avec les pronoms COD : 'Je les ai vus' / 'Je les ai entendues'.",evaluation:"Accorde si nécessaire le participe passé : 'Les lettres qu'il a écri__ / Les défauts que nous avons observé__ / La leçon qu'elle a appri__.'",devoirMaison:"Écris 5 phrases avec des participes passés employés avec avoir : 2 avec accord et 3 sans accord. Justifie chaque cas.",isIntegration:false},{idx:94,semaine:"22",domaine:"GRAMMAIRE",titre:"La proposition subordonnée complétive (COD du verbe de la principale)",texteRef:"",situationApprentissage:"Identifie dans les phrases 'Elle savait que Maïmouna souffrait' et 'Il pensait qu'il aurait la paix' les propositions subordonnées. Explique leur fonction et leur mode.",traceEcrite:"1- La proposition subordonnée complétive est introduite par 'que' (ou 'qu'). 2- Elle a la fonction de COD du verbe de la principale. 3- Elle est introduite après des verbes de : déclaration (dire, affirmer), pensée (penser, croire, savoir), sentiment (craindre, espérer), volonté (vouloir, souhaiter). 4- Mode : indicatif après les verbes de certitude / subjonctif après les verbes de doute, de volonté ou d'émotion.",evaluation:"Construis une phrase avec une subordonnée complétive à partir de chaque verbe : 'espérer', 'savoir', 'craindre', 'affirmer'.",devoirMaison:"Trouve 5 verbes introducteurs de propositions complétives et construis une phrase avec chacun.",isIntegration:false},{idx:95,semaine:"22",domaine:"EXPRESSION ECRITE",titre:"La rédaction d'un portrait moral argumenté",texteRef:"",situationApprentissage:"Tu vas rédiger le portrait moral d'un personnage (de ton choix ou tiré d'une œuvre) en montrant à travers des anecdotes et des exemples précis ses qualités dominantes et un défaut qui le rend plus humain.",traceEcrite:"Structure du portrait moral argumenté : 1- Introduction : présenter brièvement le personnage. 2- Corps : pour chaque qualité/défaut, illustrer par un e titue un réseau lexical de l'exploration.",traceEcrite:"1- Vocabulaire du voyage : l'itinéraire, l'escale, le trajet, la traversée, l'embarquement, l'expédition, la destination, le périple. 2- Vocabulaire de la découverte : l'exploration, la cartographie, le territoire inexploré, la frontière, l'horizon, la pionnière. 3- Vocabulaire de l'espace : la galaxie, l'orbite, la gravité, la fusée, le cosmos, l'astronaute, la trajectoire, la ténèbre spatiale. 4- Expressions idiomatiques : 'partir à l'aventure', 'battre des records', 'repousser les limites', 'ouvrir de nouvelles voies'.",evaluation:"Construis une carte mentale du vocabulaire du voyage avec au moins 15 mots classés en 3 catégories.",devoirMaison:"Cherche le sens de 5 mots liés à l'exploration spatiale que tu ne connaissais pas encore.",isIntegration:false},{idx:99,semaine:"24",domaine:"ORTHOGRAPHE",titre:"Les signes de ponctuation et leurs rôles dans le texte",texteRef:"",situationApprentissage:"Dans le texte 'Propulsés dans l'espace', la ponctuation joue un rôle expressif particulier. Relève et explique l'effet produit par les points de suspension, les points d'exclamation et les deux-points.",traceEcrite:"Rôles des signes de ponctuation : 1- Le point (.) : marque la fin d'une phrase déclarative. 2- Le point d'exclamation (!) : exprime une émotion forte (surprise, peur, joie). 3- Le point d'interrogation (?) : clôt une phrase interrogative. 4- Les points de suspension (...) : marque une hésitation, une interruption, une attente. 5- Le deux-points (:) : introduit une explication, une citation, une énumération. 6- Le tiret (-) dans un dialogue : indique un changement de locuteur. La ponctuation rythme la lecture et guide l'interprétation.",evaluation:"Réécris ce texte en ajoutant la ponctuation correcte : 'Barkley où es tu des voix appelaient dans l obscurité le capitaine répondit je suis là ne bougez pas'.",devoirMaison:"Écris un dialogue de 8 répliques entre deux astronautes perdus dans l'espace en utilisant correctement tous les signes de ponctuation.",isIntegration:false},{idx:100,semaine:"24",domaine:"GRAMMAIRE",titre:"Le discours direct et le discours indirect",texteRef:"",situationApprentissage:"Dans le texte 'Propulsés dans l'espace', les répliques des astronautes sont au discours direct. Transforme-les au discours indirect et observe les changements grammaticaux.",traceEcrite:"1- Discours direct : reproduit exactement les paroles, entre guillemets ou précédé d'un tiret. Exemple : Il cria : « Barkley, où es-tu ? » 2- Discours indirect : les paroles sont intégrées dans la phrase avec un verbe introducteur et une conjonction. Exemple : Il cria en demandant où était Barkley. 3- Changements au passage DI → indirect : • Les pronoms personnels changent • Le mode peut changer (interrogation indirecte : si / où / que) • La ponctuation change (pas de guillemets ni de tiret) 4- Verbes introducteurs : dire, affirmer, demander, expliquer, crier, répondre, chuchoter.",evaluation:"Transforme au discours indirect : '- Capitaine, nous sommes perdus ! dit Woode. - Je sais, répondit-il. Restez calmes et attendez.'",devoirMaison:"Trouve dans un livre 5 exemples de discours direct et transforme-les en discours indirect.",isIntegration:false},{idx:101,semaine:"24",domaine:"EXPRESSION ECRITE",titre:"La rédaction d'un texte imaginaire : un voyage dans un pays inconnu",texteRef:"",situationApprentissage:"Imagine que tu es le premier humain à découvrir une nouvelle planète, une île inconnue ou un pays caché. Rédige un texte de 15 à 20 lignes décrivant tes premières impressions, les êtres ou les paysages que tu découvres, et tes émotions.",traceEcrite:"Pour rédiger un texte de découverte imaginaire : 1- Décrire le contexte d'arrivée (comment, où, dans quel état). 2- Décrire l'environnement en allant du général au particulier. 3- Intégrer des détails sensoriels (couleurs, sons, odeurs, textures). 4- Exprimer les émotions et les réflexions du narrateur. 5- Utiliser le présent de narration ou // ---- APP ----
const DOM_COL={LIRE:'#2563EB',ORAL:'#7C3AED',VOCABULAIRE:'#0D9488',ORTHOGRAPHE:'#B45309',GRAMMAIRE:'#047857','EXPRESSION ECRITE':'#B91C1C'};
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
let state={theme:null};
function renderList(){
  let h='<p style="font-size:13px;color:var(--ink-soft);margin-bottom:14px;">Sélectionnez un thème</p>';
  THEMES.forEach((t,i)=>{
    h+=`<div class="theme-card" onclick="openTheme(${i})">
      <div class="num">${t.num}</div>
      <div class="info"><h3>${esc(t.titre)}</h3><span>${t.volume} · ${t.seances.length} séances · ${t.integrations.length} intégrations</span></div>
      <div class="arrow">›</div></div>`;
  });
  document.getElementById('viewList').innerHTML=h;
}
function openTheme(tIdx){
  state.theme=tIdx;
  const t=THEMES[tIdx];
  document.getElementById('hdrThemeTitre').textContent=t.titre;
  document.getElementById('hdrThemeMeta').textContent=t.volume;
  document.getElementById('hdrList').style.display='none';
  document.getElementById('hdrTheme').style.display='flex';
  document.getElementById('viewList').classList.remove('active');
  document.getElementById('viewTheme').classList.add('active');
  const byWeek={};
  t.seances.forEach(s=>{const w=s.semaine||'?';if(!byWeek[w])byWeek[w]=[];byWeek[w].push(s);});
  let h='';
  Object.keys(byWeek).sort((a,b)=>parseInt(a)-parseInt(b)).forEach(w=>{
    h+=`<div class="semaine-group"><div class="semaine-title">Semaine ${w}</div>`;
    byWeek[w].forEach(s=>{
      const col=DOM_COL[s.domaine]||'var(--teal)';
      h+=`<div class="seance-card" onclick="openSeance(${tIdx},${s.idx},false)">
        <div><div class="dom-badge" style="color:${col}">${esc(s.domaine)}</div><div class="titre-text">${esc(s.titre||'—')}</div></div>
        <div class="arrow">›</div></div>`;
    });
    h+='</div>';
  });
  if(t.integrations.length){
    h+=`<div class="semaine-group"><div class="semaine-title" style="color:var(--clay)">🧩 Semaine d'intégration</div>`;
    t.integrations.forEach(s=>{
      h+=`<div class="seance-card integration" onclick="openSeance(${tIdx},${s.idx},true)">
        <div><div class="dom-badge integration">${esc(s.domaine||'INTÉGRATION')}</div><div class="titre-text">${esc(s.titre||'Évaluation / intégration')}</div></div>
        <div class="arrow">›</div></div>`;
    });
    h+='</div>';
  }
  document.getElementById('viewTheme').innerHTML=h;
}
function goList(){
  document.getElementById('hdrTheme').style.display='none';
  document.getElementById('hdrList').style.display='flex';
  document.getElementById('viewTheme').classList.remove('active');
  document.getElementById('viewList').classList.add('active');
}
function openSeance(tIdx,sIdx,isInt){
  const t=THEMES[tIdx];
  const all=[...t.seances,...t.integrations];
  const s=all.find(x=>x.idx===sIdx)||all[0];
  document.getElementById('hdrFicheTitre').textContent=s.titre||'Intégration';
  document.getElementById('hdrFicheMeta').textContent=(s.domaine||'')+' · 55 min · Semaine '+(s.semaine||'?');
  document.getElementById('hdrTheme').style.display='none';
  document.getElementById('hdrFiche').style.display='flex';
  document.getElementById('viewTheme').classList.remove('active');
  document.getElementById('viewFiche').classList.add('active');
  let h='';
  if(isInt)h+=`<div class="integration-banner">🧩 Séance d'intégration — les apprenants mobilisent l'ensemble des capacités du thème.</div>`;
  if(s.texteRef){
    h+=`<div class="card"><h3>Texte support</h3>
      <p class="texte-ref">${esc(s.texteRef)}</p>
      <div style="margin-top:8px;font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em;margin-bottom:4px;">Texte complet (à coller depuis le recueil)</div>
      <div class="texte-zone" contenteditable="true" data-key="texte_${sIdx}" data-placeholder="Collez ici le texte depuis le recueil..."></div>
    </div>`;
  }
  if(s.situationApprentissage){
    h+=`<div class="card"><h3>Situation d'apprentissage</h3><div class="sp-box">${esc(s.situationApprentissage)}</div></div>`;
  }
  const phases=[
    {nom:'Révision / Lancement',dur:"10'",desc:"Correction de l'exercice de maison. Annonce de la situation d'apprentissage ; les apprenants reformulent la consigne et rappellent les ressources à mobiliser."},
    {nom:'Recherches',dur:"15'",desc:"Les apprenants travaillent en binôme ou en groupe sur la situation. Le professeur guide par questionnement et encourage la manipulation."},
    {nom:'Mise en commun',dur:"10'",desc:"Mise en commun des propositions. Le professeur liste les réponses, débat et structure collectivement."},
    {nom:'Trace écrite / Institutionnalisation',dur:"15'",desc:s.traceEcrite?esc(s.traceEcrite):'<span class="no-content">À compléter</span>'},
    {nom:'Évaluation / Entraînement',dur:"5'",desc:s.evaluation?esc(s.evaluation):'<span class="no-content">À compléter</span>'}
  ];
  h+=`<div class="card"><h3>Déroulement — 55 min</h3>`;
  phases.forEach(p=>{
    h+=`<div class="deroul-phase"><div><span class="phase-name">${p.nom}</span><span class="phase-dur">${p.dur}</span></div><p style="font-size:13.5px;margin-top:4px;line-height:1.5;">${p.desc}</p></div>`;
  });
  h+='</div>';
  if(s.devoirMaison)h+=`<div class="card"><h3>Travail à la maison</h3><p>${esc(s.devoirMaison)}</p></div>`;
  const el=document.getElementById('viewFiche');
  el.innerHTML=h;
  el.querySelectorAll('.texte-zone').forEach(box=>{
    const saved=localStorage.getItem('fr5e_'+box.dataset.key);
    if(saved)box.textContent=saved;
    box.addEventListener('blur',()=>localStorage.setItem('fr5e_'+box.dataset.key,box.textContent));
  });
}
function goTheme(){
  document.getElementById('hdrFiche').style.display='none';
  document.getElementById('hdrTheme').style.display='flex';
  document.getElementById('viewFiche').classList.remove('active');
  document.getElementById('viewTheme').classList.add('active');
}
renderList();
</script>
